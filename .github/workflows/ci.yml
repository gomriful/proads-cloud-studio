name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Automated tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg and text-shaping libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg libfribidi0 espeak-ng
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -v

  # Proves on a real GitHub runner that the sample advertisement renders at
  # full 1080p; the MP4 is attached to the run as an artifact.
  sample-render:
    name: Sample advertisement
    uses: ./.github/workflows/render.yml
    with:
      config: configs/dream_house_meuble.json
      format: config
      quality: final
