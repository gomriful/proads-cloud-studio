name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Automated tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg and text-shaping libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg libfribidi0 espeak-ng
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -v

  # Proves on a real GitHub runner that the sample advertisement renders at
  # full 1080p; the MP4 is attached to the run as an artifact.
  sample-render:
    name: Sample advertisement (1080p)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg and text-shaping libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg libfribidi0 espeak-ng
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate and render the sample
        run: |
          python -c "from proads.textrender import shaping_engine; print('Arabic shaping engine:', shaping_engine())"
          python -m proads validate configs/dream_house_meuble.json
          python -m proads render configs/dream_house_meuble.json --output output
      - name: Print FFmpeg logs (on failure)
        if: failure()
        run: tail -n 60 output/logs/*.log || true
      - name: Upload sample MP4
        uses: actions/upload-artifact@v4
        with:
          name: sample-advertisement-${{ github.run_number }}
          path: |
            output/*.mp4
            output/render_report.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
